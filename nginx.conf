# FiestaExpert production reverse proxy (D-010, UR-006.3, UR-008.2).
#
# Mounted at /etc/nginx/nginx.conf by docker-compose.yml. Serves the SPA from
# /usr/share/nginx/html (host ./frontend/dist), reverse-proxies /api and
# /socket.io to the backend, and forwards signed /uploads to the backend for
# HMAC-SHA256 validation. TLS termination is delegated to Cloudflare in
# production; the 443 listener here uses origin certs from ./certs for
# direct / Full-Strict setups.

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # --- Compression (UR-006.3) --------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Map Upgrade header for WebSocket proxying (D-006).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:3000;
        keepalive 16;
    }

    # --- HTTP → HTTPS (Cloudflare Full proxy handles edge TLS; this keeps
    #     direct-origin HTTP from ever serving plaintext) ---------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Origin certificate. Obtain Cloudflare Origin CA or Let's Encrypt
        # certs and place them as ./certs/fullchain.pem + ./certs/privkey.pem.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_prefer_server_ciphers on;

        # --- Security headers (UR-008.2) ------------------------------------
        # HSTS is only sent over HTTPS. CSP allows the SPA's own scripts, the
        # Connekta.js card-field SDK (cdn.conekta.io), Google Fonts/Material
        # Symbols, and https: images (provider-uploaded photo URLs).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.conekta.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=()" always;

        # SPA root (UR-006.3): fall back to index.html for client routing.
        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Never cache the HTML shell; keep security headers applied.
        location = /index.html {
            expires -1;
        }

        # Hashed assets are immutable → long cache (keeps server-level
        # security headers because no add_header is redefined here).
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        # --- REST API (UR-006.3, BR-001.8) ----------------------------------
        # Path is passed through unchanged (/api/v1/... → backend).
        location /api/ {
            proxy_pass        http://backend;
            proxy_http_version 1.1;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_set_header  Upgrade           $http_upgrade;
            proxy_set_header  Connection        $connection_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
            # Fall over to the next backend worker on 502/503 etc.
            proxy_next_upstream error timeout http_502 http_503;
        }

        # --- Socket.IO (D-006, UR-009.4): WebSocket upgrade -----------------
        location /socket.io/ {
            proxy_pass        http://backend;
            proxy_http_version 1.1;
            proxy_set_header  Upgrade    $http_upgrade;
            proxy_set_header  Connection $connection_upgrade;
            proxy_set_header  Host       $host;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # --- Signed uploads (D-004, BR-013.6) -------------------------------
        # The backend validates the HMAC-SHA256 signed URL itself
        # (createUploadsGuard in storage.service.ts). We intentionally proxy to
        # it instead of serving the volume with nginx `secure_link`: secure_link
        # only computes MD5, while storage.service signs with HMAC-SHA256, so
        # Nginx would reject every backend-issued token. Proxying keeps the
        # exact local/development behavior in production.
        location /uploads/ {
            proxy_pass        http://backend;
            proxy_set_header  Host       $host;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering   off;    # stream audio/voice notes promptly
            proxy_read_timeout 120s;
        }
    }
}
