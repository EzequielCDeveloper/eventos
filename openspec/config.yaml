schema: spec-driven

context: |
  Project: eventos — Marketplace de servicios para eventos en México (salones, sonido, servicios-persona).
  Modelo: Airbnb para eventos. Documentación de producto en markdown (español).
  Roles: usuario normal, prestador de servicio, administrador.
  Repo: documentation-only (no source code). 16 domain specs, 15 product docs, 2 archived changes.
  Planned stack: Node.js + Express + MariaDB backend; React + Vite frontend; Socket.IO chat; Conekta payments; Docker + VPS + Nginx + Cloudflare deploy.
  Database: MySQL 8.0+ / MariaDB 10.6+ (schema: eventos_db, 1051 lines).
  Artifact store: hybrid (openspec + engram).

rules:
  proposal:
    - Incluir plan de rollback para cambios de alto riesgo
    - Documentar impacto en los 3 roles de usuario
  specs:
    - Usar Given/When/Then para escenarios
    - Usar keywords RFC 2119 (MUST, SHALL, SHOULD, MAY)
    - Mantener specs en español neutro/profesional
  design:
    - Incluir diagramas de secuencia para flujos complejos
    - Documentar decisiones de arquitectura con justificación
  tasks:
    - Agrupar por fase, usar numeración jerárquica
    - Mantener tareas completables en una sesión
  apply:
    guidelines:
      - Seguir convenciones existentes del proyecto
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Advertir antes de fusionar deltas destructivos
